name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Started by the redeploy job below (and usable by hand from the Actions tab).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deploy: ${{ steps.deployment.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitLastMod()/gitFirstMod() in build.js derive per-page
          # lastmod, "last updated" meta and Article datePublished from git log.
          # A shallow clone makes every file report the same (HEAD) date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # OG images are rendered from SVG at build time: without a CJK font the
      # Chinese and Japanese text comes out as boxes. A failure here shouldn't
      # block a deploy.
      - name: Install CJK font
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - run: pip install genanki

      - run: npm ci
      - run: npm run build
      - run: python build-anki.py

      # Snapshot the sitemap that is live right now, before this deploy replaces
      # it, so indexnow.mjs can submit only the URLs whose lastmod changed.
      - name: Save live sitemap
        continue-on-error: true
        run: curl -sf https://jpnotes.dev/sitemap.xml -o prev-sitemap.xml || rm -f prev-sitemap.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # Notify Bing/Yandex/etc. of pages changed by this deploy (Google ignores IndexNow).
      # Runs after deploy so the key file at /<key>.txt is already live for
      # verification. Non-fatal: a ping failure must never block the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: node indexnow.mjs

  # GitHub Pages sometimes sits in "syncing_files" until deploy-pages gives up
  # after its fixed 10 minutes (first seen 2026-11-10, many repositories, status
  # page green). Re-running does not help: the deployment id is the commit sha,
  # and a second deployment under a cancelled id never starts. A new commit
  # does, so when the deploy step of a push fails this pushes an empty one and
  # starts the workflow on it. Once only: the run it starts is a
  # workflow_dispatch, which this job skips. A push made with GITHUB_TOKEN
  # starts no workflow by itself, hence the explicit dispatch.
  # The empty commit lands on main: `git pull --rebase` before the next push.
  redeploy:
    needs: build-and-deploy
    if: failure() && github.event_name == 'push' && needs.build-and-deploy.outputs.deploy == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Push an empty commit and deploy it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Redeploy (Pages deployment timed out)"
          if git push origin HEAD:main; then
            gh workflow run deploy.yml --ref main
          else
            echo "main has moved on; the newer push deploys instead."
          fi
