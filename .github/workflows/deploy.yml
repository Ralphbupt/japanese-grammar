name: Deploy

# Builds the site and publishes dist/ to Cloudflare, which serves it as static
# assets (worker/wrangler.site.toml: Worker "jpnotes-site" on jpnotes.dev).
# Moved off GitHub Pages on 2026-11-10: its deployments had started to stall
# in "syncing_files" until the action's fixed 10-minute timeout.
# Secret: CLOUDFLARE_API_TOKEN (Cloudflare's "Edit Cloudflare Workers" template).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitLastMod()/gitFirstMod() in build.js derive per-page
          # lastmod, "last updated" meta and Article datePublished from git log.
          # A shallow clone makes every file report the same (HEAD) date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # OG images are rendered from SVG at build time: without a CJK font the
      # Chinese and Japanese text comes out as boxes. A failure here shouldn't
      # block a deploy.
      - name: Install CJK font
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - run: pip install genanki

      - run: npm ci
      - run: npm run build
      - run: python build-anki.py

      # Snapshot the sitemap that is live right now, before this deploy replaces
      # it, so indexnow.mjs can submit only the URLs whose lastmod changed.
      - name: Save live sitemap
        continue-on-error: true
        run: curl -sf https://jpnotes.dev/sitemap.xml -o prev-sitemap.xml || rm -f prev-sitemap.xml

      # Uploads only the files that changed. wrangler comes from worker/'s lockfile.
      - name: Deploy to Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npx wrangler deploy -c wrangler.site.toml

      # Notify Bing/Yandex/etc. of pages changed by this deploy (Google ignores IndexNow).
      # Runs after deploy so the key file at /<key>.txt is already live for
      # verification. Non-fatal: a ping failure must never block the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: node indexnow.mjs
