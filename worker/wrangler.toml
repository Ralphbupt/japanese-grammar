name = "jpnotes-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "ai.jpnotes.dev", custom_domain = true }]

# No request logging: questions and IPs never land in Cloudflare logs.
[observability]
enabled = false

[ai]
binding = "AI"

# Usage counter only (button, outcome, neurons) — no IPs, no text.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "jpnotes_ai_usage"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# Secrets (set once, never committed):
#   npx wrangler secret put IP_SALT      # any random string

# Reader feedback (POST /feedback). Created 2026-10-28 with:
#   npx wrangler d1 create jpnotes-feedback
#   npx wrangler d1 migrations apply jpnotes-feedback --remote
[[d1_databases]]
binding = "FEEDBACK"
database_name = "jpnotes-feedback"
database_id = "fb4067ba-3c82-4014-bf38-3afb8fc2e6df"
migrations_dir = "migrations"
