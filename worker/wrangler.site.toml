# The site itself: dist/ served as static assets by Cloudflare (no script).
#   npm run build && npx wrangler deploy -c wrangler.site.toml      (from worker/)
# Requests for files are free and don't count against the Workers plan.
# dist/_redirects and dist/_headers (written by build.js) are applied by Cloudflare.
# jpnotes.dev was attached in the dashboard on 2026-11-10 (Worker → Domains), after
# deleting the four A records that pointed at GitHub Pages. www.jpnotes.dev and the
# old ralphbupt.github.io/japanese-grammar/ still redirect here through GitHub
# Pages, which stays enabled (with its custom domain) for that alone.
name = "jpnotes-site"
compatibility_date = "2026-09-01"
workers_dev = false         # true gives a jpnotes-site.<account>.workers.dev copy, for checks without touching the domain
preview_urls = false
routes = [{ pattern = "jpnotes.dev", custom_domain = true }]

[assets]
directory = "../dist"
# /lesson18 → /lesson18/ (served from lesson18/index.html), as on GitHub Pages.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
