<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://api.jpnotes.dev http://localhost:8788; media-src https://api.jpnotes.dev http://localhost:8788; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N2 真题语法突击</title>
<!-- Private page (invited Google accounts only): an empty shell; the content comes from
     api.jpnotes.dev/cram/data (worker/src/account.js, "Private extras"). -->
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1f2733;--mute:#6b7380;--line:#e3e7ee;--ui:#24324a;--ui-on:#fff;--ui-soft:#e9eef6;--red:#b4232a;--hl:#fff3c4;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2027;--ink:#e6e8eb;--mute:#9aa3ad;--line:#2b313a;--ui:#9db4d8;--ui-on:#14171c;--ui-soft:#243045;--red:#e94560;--hl:#3a3220;--chip:#232a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"PingFang SC","Hiragino Sans",sans-serif;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
h1{font-size:22px;margin:16px 0 4px}.lead{color:var(--mute);font-size:14px;margin:0 0 6px}
#ctl{padding:4px 0 6px;border-bottom:1px solid var(--line)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row+.row{margin-top:8px}
#play{width:44px;height:36px;border-radius:8px;border:0;background:var(--ui);color:var(--ui-on);font-size:16px;cursor:pointer}
#seek{flex:1;min-width:120px;accent-color:var(--ui)}#time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.row button,.row select,#q{font:inherit;font-size:13px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#q{width:120px;cursor:text}
.row button[aria-pressed=true]{background:var(--ui);color:var(--ui-on);border-color:var(--ui)}
.toc{font-size:13px;gap:6px}.toc span{color:var(--mute)}.toc a{padding:1px 8px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ui);background:var(--card)}.toc a.on{background:var(--ui);color:var(--ui-on)}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.msg{text-align:center;color:var(--mute);margin:40px 0}.msg a{color:var(--ui)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;scroll-margin-top:16px}
.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.no{color:var(--mute);font-size:13px}
.g{font-size:21px;font-weight:700;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.yr{margin-left:auto;font-size:12px;color:var(--mute)}
.badge{font-size:12px;border-radius:10px;padding:1px 8px;background:var(--red);color:#fff;white-space:nowrap}
.badge.soft{background:var(--chip);color:var(--mute)}
.form{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}.form code{font:inherit;font-size:14px;background:var(--chip);border-radius:6px;padding:1px 8px}
.mean{margin:6px 0 2px}
.ex{margin:10px 0 0;padding-left:10px;border-left:3px solid var(--line)}.ex p{margin:0}
.ja{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px}.ja b{color:var(--red)}
.tr{color:var(--mute);font-size:14px}
.vs{font-size:14px;background:var(--chip);border-radius:8px;padding:6px 10px;margin:10px 0 0}.vs span{color:var(--mute);margin-right:6px}
.fix{font-size:12px;color:var(--red);margin-top:6px}
.ln{cursor:pointer;border-radius:6px;padding:1px 4px;margin:0 -4px}.ln:hover{background:var(--ui-soft)}.ln.cur{background:var(--hl);box-shadow:inset 3px 0 0 var(--ui)}
.notr .tr{opacity:.55}
.onlyreal .card.fake{display:none}
.hide .mean,.hide .tr{filter:blur(5px)}.hide .mean:hover,.hide .tr:hover{filter:none}
.foot{color:var(--mute);font-size:13px;margin-top:20px}
/* tabs: 语法突击 (the audio page) + the extra decks (text only) */
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}#tabs button{font:inherit;font-size:14px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ui);cursor:pointer}
#tabs button[aria-pressed=true]{background:var(--ui);color:var(--ui-on);border-color:var(--ui);font-weight:600}#tabs small{opacity:.7;font-size:.8em}
body.xt #ctl,body.xt #bar,body.xt #list,body.xt .lead{display:none}body:not(.xt) #xt{display:none}
#xt{padding-bottom:40px}.xrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.xrow input,.xrow select,.xrow button{font:inherit;font-size:13px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.xrow button[aria-pressed=true]{background:var(--ui);color:var(--ui-on);border-color:var(--ui)}
.occ{margin:8px 0 0}.occ summary{cursor:pointer;color:var(--mute);font-size:13px}.occ li{margin:6px 0}.occ .sit{font-size:12px;color:var(--mute);margin-right:6px}
table.xt{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border-radius:10px;overflow:hidden}table.xt td,table.xt th{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}table.xt th{font-size:12px;color:var(--mute);font-weight:500}
.sm{font-size:12px;color:var(--mute)}.opts{margin:6px 0;padding-left:1.4em}.ans{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--chip)}.card.show .ans{display:block}
.xhide .zh,.xhide .rd{filter:blur(5px)}.xhide .zh:hover,.xhide .rd:hover{filter:none}
.cat{font-size:13px;color:var(--mute);margin:18px 0 4px;font-weight:600}
</style>
</head>
<body>
<div class="wrap"><h1>N2 真题突击 · <span id="cnt"></span></h1><div id="tabs"></div>
<p class="lead">按「语法 → 意思 → 真题例句 → 翻译」朗读。点任意一行从那里开始听。</p></div>
<div class="wrap" id="xt"></div>
<div class="wrap" id="ctl">
  <div class="row"><button data-mode="all" aria-pressed="true">整体连播</button><button data-mode="one" aria-pressed="false">一句一停</button><button data-mode="loop" aria-pressed="false">单句循环</button><button data-mode="part" aria-pressed="false">本段连播</button>
    <button id="trs" aria-pressed="true">念翻译</button><button id="hz" aria-pressed="false">遮住意思</button><button id="real" aria-pressed="false">只看真题</button><input id="q" placeholder="搜语法/序号"></div>
  <div class="row toc" id="toc"></div>
</div>
<div id="bar"><div class="wrap"><div class="row"><button id="play" aria-label="播放">▶</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="time">0:00</span>
  <select id="rate" aria-label="语速"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></div></div></div>
<main class="wrap" id="list"></main>
<audio id="a" crossorigin="anonymous" preload="metadata"></audio>
<script>
(async function () {
  const list = document.getElementById('list'), a = document.getElementById('a');
  const say = (h) => { list.innerHTML = '<p class="msg">' + h + '</p>'; };
  const local = new URLSearchParams(location.search).get('acct') === 'local' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const API = local ? 'http://localhost:8788' : 'https://api.jpnotes.dev';
  const ls = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  let tok = ''; try { tok = (JSON.parse(ls.get('jp_acct')) || {}).token || ''; } catch (e) {}
  if (!tok) return say('这一页只对受邀的 Google 账号开放。请先在 <a href="/">jpnotes.dev</a> 右上角的账号按钮里用 Google 登录。');
  let d;
  try {
    const r = await fetch(API + '/cram/data', { headers: { Authorization: 'Bearer ' + tok } });
    d = await r.json();
    if (r.status === 401) return say('登录已过期，请回 <a href="/">jpnotes.dev</a> 重新登录。');
    if (!r.ok) return say(r.status === 403 ? '这个账号不在受邀名单里。' : '加载失败：' + (d.error || r.status));
  } catch (e) { return say('网络错误，刷新再试。'); }
  const items = d.items, T = d.timing.lines;
  a.src = API + d.audio;
  // The address is signed for 12 hours: when it fails (expired, or the network
  // dropped), ask for a fresh one once and carry on from the same place.
  let renewed = 0;
  a.addEventListener('error', async () => {
    if (renewed++ > 2) return;
    try {
      const r = await fetch(API + '/cram/data', { headers: { Authorization: 'Bearer ' + tok } }), x = await r.json();
      if (!r.ok || !x.audio) return;
      const at = a.currentTime || 0, wasPlaying = !a.paused;
      a.src = API + x.audio;
      a.addEventListener('loadedmetadata', () => { try { a.currentTime = at; } catch (e) {} if (wasPlaying) a.play().catch(() => {}); }, { once: true });
    } catch (e) {}
  });
  document.getElementById('cnt').textContent = items.length + ' 条';
  const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const idx = {}; T.forEach((l, i) => { idx[l.n + l.k] = i; });
  const ln = (n, k, cls, html) => `<p class="ln ${cls}" data-i="${idx[n + k]}">${html}</p>`;
  const mark = (ex, hl) => { let h = esc(ex); (hl || []).forEach((s) => { const e = esc(s); if (e) h = h.split(e).join('<b>' + e + '</b>'); }); return h; };
  const PART = 25, parts = [];
  list.innerHTML = items.map((it, k) => {
    if (k % PART === 0) parts.push(it.n);
    const yrs = it.real === false ? '<span class="badge soft">例句（非真题）</span>' : it.year ? '<span class="badge">真题 ' + esc(it.year) + '</span>' : '';
    return `<section class="card${it.real === false ? ' fake' : ''}" id="n${it.n}" data-s="${esc(it.n + ' ' + it.g + ' ' + it.zh + ' ' + it.mean)}">
      <div class="hd"><span class="no">${it.n}</span><span class="ln g" data-i="${idx[it.n + 'g']}">${esc(it.g)}</span>${yrs}${it.other ? '<span class="yr">其余：' + esc(it.other) + '</span>' : ''}</div>
      ${it.form && it.form.length ? '<div class="form">' + it.form.map((f) => '<code>' + esc(f) + '</code>').join('') + '</div>' : ''}
      ${ln(it.n, 'm', 'mean', esc(it.mean))}
      <div class="ex">${ln(it.n, 'e', 'ja', mark(it.ex, it.hl))}${ln(it.n, 't', 'tr', esc(it.tr))}</div>
      ${it.vs ? '<p class="vs"><span>易混</span>' + esc(it.vs) + '</p>' : ''}
      ${it.fixed ? '<p class="fix">原文有误，已更正</p>' : ''}</section>`;
  }).join('') + '<p class="foot">空格键播放 / 暂停，← → 上一句 / 下一句。「念翻译」关掉后只听日语。</p>';
  const toc = document.getElementById('toc');
  toc.innerHTML = '<span>段：</span>' + parts.map((n, k) => `<a href="#n${n}" data-part="${k}">${n}–${Math.min(n + PART - 1, items[items.length - 1].n)}</a>`).join('');
  const chips = toc.querySelectorAll('a');
  const partStart = parts.map((n) => idx[n + 'g']);
  const els = {}; list.querySelectorAll('[data-i]').forEach((e) => { els[e.dataset.i] = e; });
  let mode = 'all', cur = -1, stopAt = null, readTr = ls.get('jp_cram_tr') !== '0', lastPart = -1;
  const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const lineAt = (t) => { let lo = 0, hi = T.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (T[m].s <= t + 0.05) { r = m; lo = m + 1; } else hi = m - 1; } return r; };
  const partOf = (i) => { let r = 0; partStart.forEach((s, k) => { if (s <= i) r = k; }); return r; };
  const partEnd = (i) => { const k = partOf(i); return k + 1 < partStart.length ? partStart[k + 1] - 1 : T.length - 1; };
  function mark1(i, scroll) {
    if (i === cur) return;
    if (els[cur]) els[cur].classList.remove('cur');
    cur = i;
    const p = i >= 0 ? partOf(i) : -1;
    if (p !== lastPart) { if (chips[lastPart]) chips[lastPart].classList.remove('on'); if (chips[p]) chips[p].classList.add('on'); lastPart = p; }
    const e = els[i]; if (!e) return; e.classList.add('cur');
    if (scroll && Date.now() - userScroll > 4000) e.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  // Follow the reading like the podcast pages, but not while the reader is scrolling.
  let userScroll = 0;
  ['wheel', 'touchmove', 'keydown'].forEach((ev) => addEventListener(ev, (e) => { if (ev !== 'keydown' || /^(Page|Arrow(Up|Down)|Home|End)/.test(e.key)) userScroll = Date.now(); }, { passive: true }));
  const go = () => { const p = a.play(); if (p && p.catch) p.catch(() => {}); };
  function playLine(i) { if (!T[i]) return; a.currentTime = T[i].s; stopAt = mode === 'one' || mode === 'loop' ? i : mode === 'part' ? partEnd(i) : null; mark1(i, true); go(); }
  list.addEventListener('click', (e) => { const t = e.target.closest('[data-i]'); if (t) playLine(+t.dataset.i); });
  toc.addEventListener('click', (e) => { const c = e.target.closest('a'); if (!c) return; e.preventDefault(); document.querySelector(c.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); playLine(partStart[+c.dataset.part]); });
  a.addEventListener('timeupdate', () => {
    let t = a.currentTime, i = lineAt(t);
    if (stopAt != null && t >= T[stopAt].e) { if (mode === 'loop') { a.currentTime = T[stopAt].s; return; } a.pause(); stopAt = null; return; }
    // Skipped while playing on: translations when 念翻译 is off, non-exam items when 只看真题 is on.
    const skip = (j) => T[j] && ((!readTr && T[j].k === 't') || (onlyReal && fake.has(T[j].n)));
    if (i >= 0 && skip(i) && t < T[i].e - 0.15 && mode !== 'one' && mode !== 'loop') {
      let j = i; while (skip(j)) j++;
      if (T[j]) { a.currentTime = T[j].s; i = j; } else { a.pause(); return; }
    }
    mark1(i, !a.paused);
    if (a.duration) document.getElementById('seek').value = Math.round(t / a.duration * 1000);
    document.getElementById('time').textContent = fmt(t) + ' / ' + fmt(a.duration || d.timing.duration);
  });
  const pb = document.getElementById('play');
  a.addEventListener('play', () => { pb.textContent = '❚❚'; }); a.addEventListener('pause', () => { pb.textContent = '▶'; ls.set('n2cramT', a.currentTime); });
  pb.onclick = () => { if (!a.paused) return a.pause(); if (mode !== 'all' && cur >= 0) return playLine(cur); go(); };
  document.getElementById('seek').oninput = (e) => { if (a.duration) { a.currentTime = e.target.value / 1000 * a.duration; stopAt = null; } };
  document.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => {
    mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    stopAt = a.paused || cur < 0 ? null : mode === 'one' || mode === 'loop' ? cur : mode === 'part' ? partEnd(cur) : null;
  });
  document.getElementById('rate').onchange = (e) => { a.playbackRate = +e.target.value; };
  const fake = new Set(items.filter((it) => it.real === false).map((it) => it.n));
  let onlyReal = ls.get('jp_cram_real') === '1';
  const rb = document.getElementById('real');
  const showReal = () => { rb.setAttribute('aria-pressed', String(onlyReal)); list.classList.toggle('onlyreal', onlyReal); };
  rb.onclick = () => { onlyReal = !onlyReal; ls.set('jp_cram_real', onlyReal ? '1' : '0'); showReal(); }; showReal();
  const trb = document.getElementById('trs');
  const showTr = () => { trb.setAttribute('aria-pressed', String(readTr)); list.classList.toggle('notr', !readTr); };
  trb.onclick = () => { readTr = !readTr; ls.set('jp_cram_tr', readTr ? '1' : '0'); showTr(); }; showTr();
  document.getElementById('hz').onclick = (e) => { e.currentTarget.setAttribute('aria-pressed', String(list.classList.toggle('hide'))); };
  document.getElementById('q').oninput = (e) => { const q = e.target.value.trim(); list.querySelectorAll('.card').forEach((c) => { c.style.display = !q || c.dataset.s.includes(q) ? '' : 'none'; }); };
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); pb.click(); }
    if (e.key === 'ArrowRight' && cur < T.length - 1) playLine(cur + 1);
    if (e.key === 'ArrowLeft' && cur > 0) playLine(cur - 1);
  });
  const s0 = +ls.get('n2cramT');
  if (s0 > 1) { const i0 = lineAt(s0); a.addEventListener('loadedmetadata', function once() { a.removeEventListener('loadedmetadata', once); if (a.currentTime < 1 && T[i0]) a.currentTime = T[i0].s; }); mark1(i0, false); }

  // ─── Extra decks (d.extra from cram/extra.json, private R2): text only ───
  // adverb: [{n,g,zh,count,sets,occ:[{sitting,q,ja}]}]; words: [{n,w,r,zh,kind,sets,count,sittings}];
  // order: [{cat,group,sitting,q,stem,opts,star,full,note}]; kanji: [{w,r,…}]; affixes: [{type,affix,zh,items:[{w,sitting}]}]; paraphrase: [...]
  const X = d.extra || {}, xt = document.getElementById('xt'), tabsEl = document.getElementById('tabs');
  const sit = (s) => s ? esc(String(s).replace('-', '.')) : '';
  const DECKS = [['main', '语法突击', items.length], ['adverb', '副词语法', (X.adverb || []).length], ['words', '选项高频词', (X.words || []).length],
    ['order', '排序题', (X.order || []).length], ['kanji', '汉字', (X.kanji || []).length], ['affixes', '接头接尾', (X.affixes || []).length], ['paraphrase', '同义替换', (X.paraphrase || []).length]].filter((k) => k[0] === 'main' || k[2]);
  let deck = ls.get('jp_cram_deck') || 'main'; if (!DECKS.some((k) => k[0] === deck)) deck = 'main';
  const bar = (extra) => `<div class="xrow"><input id="xq" placeholder="搜索"><button id="xh" aria-pressed="false">遮住意思</button>${extra || ''}</div>`;
  const filt = () => { const q = (document.getElementById('xq') || {}).value || ''; xt.querySelectorAll('[data-s]').forEach((c) => { c.style.display = !q || c.dataset.s.includes(q) ? '' : 'none'; }); };
  const RENDER = {
    adverb: () => bar() + (X.adverb || []).map((it) => `<section class="card" data-s="${esc(it.n + ' ' + it.g + ' ' + it.zh)}"><div class="hd"><span class="no">${it.n}</span><span class="g">${esc(it.g)}</span><span class="badge">${it.count} 次 / ${it.sets} 套</span></div>
      <p class="mean zh">${esc(it.zh)}</p>${(it.occ || []).length ? `<details class="occ"><summary>真题出处（${it.occ.length}）</summary><ul>${it.occ.map((o) => `<li><span class="sit">${sit(o.sitting)}${o.q ? ' · ' + esc(o.q) : ''}</span><span class="ja">${esc(o.ja)}</span></li>`).join('')}</ul></details>` : ''}</section>`).join(''),
    words: () => bar('<select id="xs"><option value="n">按序号</option><option value="c">按次数</option></select>') + `<table class="xt"><thead><tr><th>#</th><th>词 / 语法</th><th>读音</th><th>意思</th><th>次数</th></tr></thead><tbody>${(X.words || []).slice().sort((a2, b2) => ls.get('jp_cram_ws') === 'c' ? (b2.count - a2.count) : (a2.n - b2.n)).map((it) => `<tr data-s="${esc(it.w + ' ' + (it.r || '') + ' ' + it.zh)}"><td class="sm">${it.n}</td><td class="ja">${esc(it.w)}${it.kind ? ' <span class="sm">' + esc(it.kind) + '</span>' : ''}</td><td class="rd">${esc(it.r || '')}</td><td class="zh">${esc(it.zh)}<div class="sm">${(it.sittings || []).map(sit).join('、')}</div></td><td class="sm">${it.count || ''}${it.sets ? ' / ' + it.sets + ' 套' : ''}</td></tr>`).join('')}</tbody></table>`,
    order: () => { const cats = [...new Set((X.order || []).map((q) => q.cat))]; let last = '';
      return bar('<select id="xc"><option value="">全部类别</option>' + cats.map((c) => `<option>${esc(c)}</option>`).join('') + '</select>') + (X.order || []).map((q, k) => {
        const head = q.cat + ' · ' + q.group !== last ? `<p class="cat" data-cat="${esc(q.cat)}">${esc(q.cat)} · ${esc(q.group)}</p>` : ''; last = q.cat + ' · ' + q.group;
        return head + `<section class="card" data-cat="${esc(q.cat)}" data-s="${esc(q.cat + ' ' + q.group + ' ' + q.stem)}"><div class="hd"><span class="no">${k + 1}</span><span class="sm">${sit(q.sitting)}${q.q ? ' · 第 ' + esc(q.q) + ' 题' : ''}</span></div>
          <p class="ja">${esc(q.stem)}</p><ol class="opts ja">${(q.opts || []).map((o) => '<li>' + esc(o) + '</li>').join('')}</ol><button class="xa">看答案</button>
          <div class="ans">★ = <b>${q.star}</b>　${esc((q.opts || [])[q.star - 1] || '')}${q.full ? `<p class="ja">${esc(q.full)}</p>` : ''}${q.note ? `<p class="sm">${esc(q.note)}</p>` : ''}</div></section>`; }).join(''); },
    // kanji: {n,w,r,zh,count,sittings,kinds,recs:[{text,sitting,q,kind}]}
    kanji: () => bar('<select id="xk"><option value="">全部题型</option>' + [...new Set((X.kanji || []).flatMap((it) => it.kinds || []))].map((k) => `<option>${esc(k)}</option>`).join('') + '</select>') +
      `<table class="xt"><thead><tr><th>#</th><th>词</th><th>读音</th><th>意思</th><th>考过</th></tr></thead><tbody>${(X.kanji || []).map((it) => `<tr data-k="${esc((it.kinds || []).join(' '))}" data-s="${esc(it.w + ' ' + (it.r || '') + ' ' + (it.zh || ''))}"><td class="sm">${it.n}</td><td class="ja">${esc(it.w)}</td><td class="rd">${esc(it.r || '')}</td><td class="zh">${esc(it.zh || '')}<div class="sm">${esc((it.kinds || []).join('・'))}</div></td><td class="sm" title="${esc((it.recs || []).map((r) => r.text + ' ' + sit(r.sitting) + ' 第' + r.q + '题').join('\n'))}">${it.count} 次<br>${(it.sittings || []).map(sit).join('、')}</td></tr>`).join('')}</tbody></table>`,
    // affixes: {type,affix,zh,items:[{w,sittings:[…]}]}
    affixes: () => bar() + (X.affixes || []).map((g) => `<section class="card" data-s="${esc(g.affix + ' ' + (g.zh || '') + ' ' + (g.items || []).map((x) => x.w).join(' '))}"><div class="hd"><span class="g">${esc(g.affix)}</span><span class="badge soft">${esc(g.type || '')}</span></div><p class="mean zh">${esc(g.zh || '')}</p>
      <p class="ja">${(g.items || []).map((x) => esc(x.w) + ((x.sittings || (x.sitting ? [x.sitting] : [])).length ? ' <span class="sm">' + (x.sittings || [x.sitting]).map(sit).join('、') + '</span>' : '')).join('　')}</p></section>`).join(''),
    // paraphrase: {cat,w,to:[…],count}
    paraphrase: () => { let last = '';
      return bar() + `<table class="xt"><tbody>${(X.paraphrase || []).map((p) => { const h = p.cat !== last ? `<tr><th colspan="3">${esc(p.cat)}</th></tr>` : ''; last = p.cat;
        return h + `<tr data-s="${esc(p.w + ' ' + (p.to || []).join(' '))}"><td class="ja">${esc(p.w)}</td><td class="ja zh">＝ ${esc((p.to || []).join('；'))}</td><td class="sm">${p.count > 1 ? p.count + ' 次' : ''}</td></tr>`; }).join('')}</tbody></table>`; },
  };
  function showDeck(k) {
    deck = k; ls.set('jp_cram_deck', k);
    tabsEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.deck === k)));
    document.body.classList.toggle('xt', k !== 'main');
    if (k !== 'main') { a.pause(); xt.innerHTML = RENDER[k](); }
  }
  if (DECKS.length > 1) {
    tabsEl.innerHTML = DECKS.map(([k, l, n]) => `<button data-deck="${k}" aria-pressed="false">${l} <small>${n}</small></button>`).join('');
    tabsEl.onclick = (e) => { const b = e.target.closest('button'); if (b) showDeck(b.dataset.deck); };
    xt.addEventListener('input', (e) => { if (e.target.id === 'xq') filt(); });
    xt.addEventListener('change', (e) => {
      if (e.target.id === 'xs') { ls.set('jp_cram_ws', e.target.value); xt.innerHTML = RENDER.words(); document.getElementById('xs').value = e.target.value; }
      if (e.target.id === 'xc') { const c = e.target.value; xt.querySelectorAll('[data-cat]').forEach((x) => { x.style.display = !c || x.dataset.cat === c ? '' : 'none'; }); }
      if (e.target.id === 'xk') { const k = e.target.value; xt.querySelectorAll('tr[data-k]').forEach((x) => { x.style.display = !k || x.dataset.k.split(' ').includes(k) ? '' : 'none'; }); }
    });
    xt.addEventListener('click', (e) => {
      if (e.target.id === 'xh') e.target.setAttribute('aria-pressed', String(xt.classList.toggle('xhide')));
      if (e.target.classList.contains('xa')) { const c = e.target.closest('.card'); c.classList.toggle('show'); e.target.textContent = c.classList.contains('show') ? '收起答案' : '看答案'; }
    });
    showDeck(deck);
  }
})();
</script>
</body>
</html>
